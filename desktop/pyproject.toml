[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anymate-controller"
version = "1.0.0"
description = "AI agent, ffmpeg, python and terminal tooling that drives the AnyMate Android studio over MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vastobb" }]
keywords = ["mcp", "animation", "ffmpeg", "ai-agent", "anymate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
anymate-controller = "anymate_controller.cli:main"

[project.urls]
Homepage = "https://github.com/vastobb/anymate"
Repository = "https://github.com/vastobb/anymate"

[tool.setuptools.packages.find]
include = ["anymate_controller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
