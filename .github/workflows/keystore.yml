name: Create release keystore

# One-off helper: creates the stable release signing key and commits it.
# A committed key keeps every release's signature identical, so new APKs
# install over the previous version. Run once from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create the keystore
        run: |
          mkdir -p signing
          if [ -f signing/anymate-controller-release.p12 ]; then
            echo "Keystore already exists — nothing to do."
            exit 0
          fi
          keytool -genkeypair -noprompt \
            -keystore signing/anymate-controller-release.p12 \
            -storetype PKCS12 \
            -storepass anymate-release-2026 \
            -keypass anymate-release-2026 \
            -alias anymate-controller \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AnyMate Controller, O=vastobb, C=US"
          echo "Created signing/anymate-controller-release.p12"

      - name: Commit the keystore
        run: |
          if git diff --quiet -- signing; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "vastobb"
          git config user.email "247711002+vastobb@users.noreply.github.com"
          git add signing/anymate-controller-release.p12
          git commit -m "build: add stable release signing key"
          git push
