name: Test anymate-controller

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Smoke + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency-free smoke test
        run: python tests/smoke.py

      - name: Unit tests
        run: python -m pytest -q

      - name: CLI check
        run: |
          anymate-controller --version
          anymate-controller tools | head -20
          anymate-controller doctor || true

  package:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AnyMate Controller ${{ github.ref_name }}
          body: |
            **AnyMate Controller** — the brain box for the AnyMate Android studio.

            • AI agent for any OpenAI-compatible endpoint (with visual feedback from canvas snapshots)
            • ffmpeg: probe, convert, extract frames, build GIFs, join clips
            • Python and a terminal sandboxed to a workspace folder
            • Animation design tools: palettes, easing curves, timing plans, storyboards, sprite sheets,
              PNG generation — with a built-in PNG codec, zero dependencies
            • Live motion presets that paint complete animations onto the phone, frame by frame
            • Exposes the whole toolbox over MCP (stdio or HTTP)

            Install: `pip install anymate-controller` or clone and `pip install -e .`
          files: dist/*
          generate_release_notes: true
